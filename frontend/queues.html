<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Management - Virtual Queue</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .grid-container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .panel { padding: 15px; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f9; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1000px;">
        <h1 class="text-center">Queue Management</h1>
        
        <div style="margin-bottom: 20px;">
            <a href="index.html" class="btn btn-secondary">← Back to Demo Session</a>
        </div>

        <div id="main-message" class="message"></div>

        <div class="grid-container">
            <!-- Left Panel: List of Queues -->
            <div class="panel">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2>All Queues</h2>
                    <button class="btn" id="show-create-btn">Create Queue</button>
                </div>
                <div id="queue-list-loading">Loading queues...</div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Business ID</th>
                            <th>Status</th>
                            <th>Capacity</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="queue-table-body">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Right Panel: Creation Form (Hidden by default) -->
            <div id="create-panel" class="panel hidden">
                <h2>Create New Queue</h2>
                <form id="createForm">
                    <div class="form-group">
                        <label>Business *</label>
                        <select id="cq-business" required>
                            <option value="">Loading businesses...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Queue Name *</label>
                        <input type="text" id="cq-name" required minlength="2" maxlength="100">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="cq-desc">
                    </div>
                    <div class="form-group">
                        <label>Capacity Type *</label>
                        <select id="cq-capacityType" required>
                            <option value="TOKEN_LIMIT">TOKEN_LIMIT</option>
                            <option value="ACTIVE_CUSTOMERS">ACTIVE_CUSTOMERS</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Max Capacity *</label>
                        <input type="number" id="cq-maxCap" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Default Service Time (mins) *</label>
                        <input type="number" id="cq-defTime" required min="1">
                    </div>
                    <div class="form-group">
                        <label>Initial Status *</label>
                        <select id="cq-status" required>
                            <option value="OPEN">OPEN</option>
                            <option value="PAUSED">PAUSED</option>
                            <option value="CLOSED">CLOSED</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Create Queue</button>
                    <button type="button" class="btn btn-secondary" id="cancel-create-btn">Cancel</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Load JavaScript Files -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/queues.js"></script>
</body>
</html>
