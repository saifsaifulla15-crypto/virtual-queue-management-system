<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select User - Virtual Queue</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .user-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .user-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; background: #fff; text-align: center; }
        .user-card h3 { margin: 0 0 10px 0; }
        .user-card p { margin: 5px 0; color: #555; }
        .role-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; color: white; margin-bottom: 15px; }
        .role-CUSTOMER { background-color: #28a745; }
        .role-STAFF { background-color: #17a2b8; }
        .role-OWNER { background-color: #6f42c1; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 900px; padding-top: 50px;">
        <h1 class="text-center">Virtual Queue System</h1>
        <p class="text-center">Welcome! Please select a user to continue to their respective dashboard, or register a new user.</p>
        
        <div style="text-align: center; margin: 20px 0;">
            <a href="register.html" class="btn btn-secondary">Register New User</a>
        </div>

        <div id="main-message" class="message"></div>
        <div id="users-loading" style="text-align: center;">Loading users...</div>

        <div id="user-grid" class="user-grid"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
