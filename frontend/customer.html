<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Virtual Queue</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { padding: 15px; border: 1px solid #ccc; background: #fff; border-radius: 4px; margin-bottom: 20px; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f9; }
        .token-display { font-size: 2em; text-align: center; font-weight: bold; margin: 15px 0; color: #0056b3; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; color: white; }
        .status-open { background-color: #28a745; }
        .status-paused { background-color: #ffc107; color: black; }
        .status-closed { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1200px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Customer Dashboard</h1>
            <div>
                <span id="user-info" style="margin-right: 15px; font-weight: bold;"></span>
                <button id="btn-logout" class="btn btn-secondary">Change User</button>
            </div>
        </div>

        <div id="main-message" class="message"></div>

        <div class="grid-container">
            <!-- Left: Available Queues -->
            <div class="panel">
                <h2>Available Queues</h2>
                <div id="queue-list-loading">Loading...</div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="queue-table-body">
                    </tbody>
                </table>
            </div>

            <!-- Right: Queue Details & Token -->
            <div class="panel">
                <h2>Queue Details</h2>
                <div id="queue-details-placeholder">Select a queue to view details.</div>
                
                <div id="queue-details-content" class="hidden">
                    <h3 id="q-name"></h3>
                    <p>Status: <span id="q-status" class="status-badge"></span></p>
                    <p>Business ID: <span id="q-biz-id"></span></p>
                    <p>Capacity: <span id="q-cap"></span></p>
                    <p>Avg Service Time: <span id="q-avg-time"></span> mins</p>

                    <hr style="margin: 15px 0;">

                    <!-- Join Section -->
                    <div id="join-section">
                        <button id="btn-join" class="btn">Join Queue</button>
                    </div>

                    <!-- Token Section -->
                    <div id="token-section" class="hidden">
                        <div class="token-display">Token: <span id="my-token-num"></span></div>
                        <h3 style="text-align: center;" id="my-token-status"></h3>
                        <p style="text-align: center;">People Ahead: <span id="my-people-ahead"></span> | Est. Wait: <span id="my-est-wait"></span> mins</p>
                        <div style="text-align: center; margin-top: 15px;">
                            <button id="btn-cancel-token" class="btn btn-secondary" style="background-color:#dc3545;">Cancel Token</button>
                            <button id="btn-refresh-token" class="btn btn-secondary">Refresh Status</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/customer.js"></script>
</body>
</html>
